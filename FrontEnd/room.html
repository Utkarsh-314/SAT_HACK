<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Meeting | SignConnect</title>

    <link rel="stylesheet" href="room.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            <span class="logo-icon">S</span>
            SignConnect
        </div>

        <div class="meeting-info">
            <span id="meetingName">Meeting Room</span>
            <span id="meetingCode"></span>
        </div>

        <div class="connection-status" id="connectionStatus">
            Connecting...
        </div>

    </header>


    <main class="meeting-container">

        <section class="video-grid">

            <div class="video-card remote-card">

                <video id="remoteVideo" autoplay playsinline>
                </video>

                <div class="video-placeholder" id="remotePlaceholder">
                    <div class="avatar">?</div>
                    <p>Waiting for participant...</p>
                </div>

                <span class="video-label" id="remoteLabel">
                    Other participant
                </span>

            </div>


            <div class="video-card local-card">

                <video id="localVideo" autoplay muted playsinline>
                </video>

                <span class="video-label">You</span>

            </div>

        </section>


        <section class="controls">

            <button id="micButton" class="control-btn">
                <span>🎙</span>
                <small>Mute</small>
            </button>

            <button id="cameraButton" class="control-btn">
                <span>📹</span>
                <small>Camera Off</small>
            </button>

            <button id="leaveButton" class="leave-btn">
                <span>📞</span>
                Leave Meeting
            </button>

        </section>


        <div id="statusMessage" class="status-message">
            Initializing meeting...
        </div>

    </main>


    <script src="room.js"></script>

</body>

</html>
